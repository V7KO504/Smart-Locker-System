    async function refreshSystemHealth() {
      const content = document.getElementById('healthContent');
      if (!content) return;
      content.innerHTML = '<div class="loading"><div class="spinner"></div> Testing connections and querying lockers...</div>';

      try {
        const response = await fetch(`${API_URL}/admin/health`, {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        if (handleUnauthorized(response)) return;

        const data = await response.json();

        // Update health indicator cards
        const up = (id, htmlVal) => { const el = document.getElementById(id); if (el) el.innerHTML = htmlVal; };
        
        up('hl-mqtt', data.mqttConnected 
          ? '<span style="color:var(--green)">Online</span>' 
          : '<span style="color:var(--red)">Offline</span>');
          
        up('hl-firebase', data.firebaseConnected 
          ? '<span style="color:var(--green)">Online</span>' 
          : '<span style="color:var(--red)">Offline</span>');
          
        up('hl-sms', data.smsGatewayStatus.includes('Sandbox') 
          ? '<span style="color:var(--orange)">Sandbox Active</span>' 
          : '<span style="color:var(--green)">Production Active</span>');
          
        up('hl-online', data.onlineCount);
        up('hl-offline', data.offlineCount);
        up('hl-sync', new Date(data.lastSyncTime).toLocaleTimeString());

        // Render health table
        let html = `
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Locker ID</th>
                  <th>Status</th>
                  <th>Door State</th>
                  <th>Battery</th>
                  <th>Signal Strength (RSSI)</th>
                  <th>Last Seen</th>
                </tr>
              </thead>
              <tbody>
        `;

        data.lockers.forEach(l => {
          const dot = l.online ? 'status-dot-green' : 'status-dot-red';
          const lastSeenText = l.lastSeen ? new Date(l.lastSeen).toLocaleString() : 'Never';
          const signalColor = l.rssi > -70 ? 'var(--green)' : l.rssi > -85 ? 'var(--orange)' : 'var(--red)';
          const batteryColor = l.battery > 50 ? 'var(--green)' : l.battery > 20 ? 'var(--orange)' : 'var(--red)';
          html += `
            <tr>
              <td><strong>Locker ${l.id}</strong></td>
              <td><span class="status-dot ${dot}"></span> ${l.online ? 'Online' : 'Offline'}</td>
              <td>${(l.doorState || 'N/A').toUpperCase()}</td>
              <td style="color:${batteryColor}; font-weight:600;">${l.battery}%</td>
              <td style="color:${signalColor}; font-weight:600;">${l.rssi} dBm</td>
              <td>${lastSeenText}</td>
            </tr>
          `;
        });
        html += '</tbody></table></div>';
        content.innerHTML = html;
      } catch (err) {
        content.innerHTML = `<div class="alert alert-error">Error loading system health: ${err.message}</div>`;
      }
    }

    /* ════════════════════════════════════════════
       ANALYTICS DASHBOARD & CHARTING
    ════════════════════════════════════════════ */
    function applyAnalyticsFilters() {
      calculateAnalytics();
    }

    function resetAnalyticsFilters() {
      const fromEl = document.getElementById('analytics-from-date');
      const toEl = document.getElementById('analytics-to-date');
      const lockerEl = document.getElementById('analytics-locker-filter');
      const eventEl = document.getElementById('analytics-event-filter');
      if (fromEl) fromEl.value = '';
      if (toEl) toEl.value = '';
      if (lockerEl) lockerEl.value = '';
      if (eventEl) eventEl.value = '';
      calculateAnalytics();
    }

    function calculateAnalytics() {
      // Filter the audit log cache
      let filtered = allLogsData;
      const lockerVal = document.getElementById('analytics-locker-filter')?.value || '';
      const eventVal  = document.getElementById('analytics-event-filter')?.value || '';
      const fromVal   = document.getElementById('analytics-from-date')?.value || '';
      const toVal     = document.getElementById('analytics-to-date')?.value || '';

      if (lockerVal) {
        filtered = filtered.filter(l => l.lockerId === lockerVal);
      }
      if (eventVal) {
        if (eventVal === 'FAILED') {
          filtered = filtered.filter(l => l.eventType === 'OTP_FAILED' || l.eventType === 'PIN_FAILED');
        } else {
          filtered = filtered.filter(l => (l.eventType || '').toUpperCase().includes(eventVal.toUpperCase()));
        }
      }
      if (fromVal) {
        const from = new Date(fromVal + 'T00:00:00');
        filtered = filtered.filter(l => new Date(l.timestamp) >= from);
      }
      if (toVal) {
        const to = new Date(toVal + 'T23:59:59.999');
        filtered = filtered.filter(l => new Date(l.timestamp) <= to);
      }

      // 1. Calculate Summary Stats
      const totalUnlocks = filtered.filter(l => ['OTP_UNLOCK', 'PIN_UNLOCK', 'ADMIN_UNLOCK'].includes(l.eventType)).length;
      const otpUnlocks = filtered.filter(l => l.eventType === 'OTP_UNLOCK').length;
      const pinUnlocks = filtered.filter(l => l.eventType === 'PIN_UNLOCK').length;
      const adminUnlocks = filtered.filter(l => l.eventType === 'ADMIN_UNLOCK').length;
      const failedAttempts = filtered.filter(l => ['OTP_FAILED', 'PIN_FAILED'].includes(l.eventType)).length;
      const tamperAlerts = filtered.filter(l => l.eventType === 'TAMPER_ALERT').length;

      // Unlocks per locker counts (for Chart 1 and Most Active calculation)
      const unlocksPerLocker = {
        'locker_01': 0, 'locker_02': 0, 'locker_03': 0,
        'locker_04': 0, 'locker_05': 0, 'locker_06': 0, 'locker_07': 0
      };
      
      filtered.forEach(log => {
        if (['OTP_UNLOCK', 'PIN_UNLOCK', 'ADMIN_UNLOCK'].includes(log.eventType)) {
          if (unlocksPerLocker[log.lockerId] !== undefined) {
            unlocksPerLocker[log.lockerId]++;
          }
        }
      });

      let mostActiveLocker = '—';
      let maxCount = 0;
      Object.entries(unlocksPerLocker).forEach(([id, cnt]) => {
        if (cnt > maxCount) {
          maxCount = cnt;
          mostActiveLocker = `Locker ${id.split('_')[1]} (${cnt})`;
        }
      });

      const avgUnlocks = (totalUnlocks / 7).toFixed(1);

      // Populate statistics labels
      const up = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
      up('an-total-unlocks', totalUnlocks);
      up('an-otp-unlocks', otpUnlocks);
      up('an-pin-unlocks', pinUnlocks);
      up('an-admin-unlocks', adminUnlocks);
      up('an-failed-attempts', failedAttempts);
      up('an-tamper-alerts', tamperAlerts);
      up('an-most-active', mostActiveLocker);
      up('an-avg-unlocks', avgUnlocks);

      // 2. Render Chart 1: Unlocks per Locker (Bar Chart)
      const ctxLocker = document.getElementById('chart-locker-unlocks')?.getContext('2d');
      if (ctxLocker) {
        if (lockerUnlocksChartInstance) lockerUnlocksChartInstance.destroy();
        lockerUnlocksChartInstance = new Chart(ctxLocker, {
          type: 'bar',
          data: {
            labels: ['Locker 1', 'Locker 2', 'Locker 3', 'Locker 4', 'Locker 5', 'Locker 6', 'Locker 7'],
            datasets: [{
              label: 'Unlocks',
              data: [
                unlocksPerLocker['locker_01'], unlocksPerLocker['locker_02'],
                unlocksPerLocker['locker_03'], unlocksPerLocker['locker_04'],
                unlocksPerLocker['locker_05'], unlocksPerLocker['locker_06'],
                unlocksPerLocker['locker_07']
              ],
              backgroundColor: '#2563EB',
              borderRadius: 5
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
          }
        });
      }

      // 3. Render Chart 2: Unlock Channels Share (Doughnut Chart)
      const ctxType = document.getElementById('chart-type-share')?.getContext('2d');
      if (ctxType) {
        if (typeShareChartInstance) typeShareChartInstance.destroy();
        typeShareChartInstance = new Chart(ctxType, {
          type: 'doughnut',
          data: {
            labels: ['OTP Unlock', 'PIN Unlock', 'Admin Unlock'],
            datasets: [{
              data: [otpUnlocks, pinUnlocks, adminUnlocks],
              backgroundColor: ['#1D4ED8', '#10B981', '#F59E0B']
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom' } }
          }
        });
      }

      // 4. Render Chart 3: Access Trends (Line Chart of unlocks over time)
      const ctxTrend = document.getElementById('chart-access-trends')?.getContext('2d');
      if (ctxTrend) {
        // Group unlocks by date
        const unlocksByDate = {};
        filtered.forEach(log => {
          if (['OTP_UNLOCK', 'PIN_UNLOCK', 'ADMIN_UNLOCK'].includes(log.eventType)) {
            const dateStr = new Date(log.timestamp).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
            unlocksByDate[dateStr] = (unlocksByDate[dateStr] || 0) + 1;
          }
        });

        // Get sorted dates (last 7 days or matching logs)
        const sortedDates = Object.keys(unlocksByDate).sort((a, b) => new Date(a) - new Date(b));
        const trendData = sortedDates.map(d => unlocksByDate[d]);

        if (accessTrendsChartInstance) accessTrendsChartInstance.destroy();
        accessTrendsChartInstance = new Chart(ctxTrend, {
          type: 'line',
          data: {
            labels: sortedDates.length > 0 ? sortedDates : ['No Data'],
            datasets: [{
              label: 'Accesses',
              data: trendData.length > 0 ? trendData : [0],
              borderColor: '#1D4ED8',
              backgroundColor: 'rgba(29, 78, 216, 0.1)',
              fill: true,
              tension: 0.3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
          }
        });
      }
    }

    /* ════════════════════════════════════════════
       SESSION / LOGOUT
    ════════════════════════════════════════════ */
    async function checkSession() {
      try {
        const response = await fetch(`${API_URL}/admin/me`, {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        if (response.status !== 200) logout();
      } catch (error) {
        console.error('Session check failed', error);
      }
    }

    async function logout() {
      // Notify the server — fire-and-forget so UI always clears even if API is down
      if (authToken) {
        fetch(`${API_URL}/admin/logout`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${authToken}` }
        }).catch(() => {});
      }
      if (tamperPollTimer)    { clearInterval(tamperPollTimer);    tamperPollTimer    = null; }
      if (lockerRefreshTimer) { clearInterval(lockerRefreshTimer); lockerRefreshTimer = null; }
      if (notificationPollTimer) { clearInterval(notificationPollTimer); notificationPollTimer = null; }
      tamperInitialized = false;
      seenTamperIds.clear();
      document.getElementById('tamperBanners').innerHTML = '';
      document.getElementById('notification-bell-wrapper').style.display = 'none';
      document.getElementById('notificationDrawer').classList.remove('active');
      localStorage.removeItem('adminToken');
      localStorage.removeItem('currentUser');
      authToken   = null;
      currentUser = null;
      showLogin();
    }

    /* ── Notifications functions ── */
    async function loadNotifications() {
      if (!authToken) return;
      try {
        const response = await fetch(`${API_URL}/admin/notifications`, {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        if (response.ok) {
          notificationsList = await response.json();
          renderNotifications();
        }
      } catch (err) {
        console.error('Failed to load notifications', err);
      }
    }

    function renderNotifications() {
      const filter = document.getElementById('notificationFilter').value;
      const listEl = document.getElementById('notificationList');
      const badgeEl = document.getElementById('unread-count');
      
      const filtered = notificationsList.filter(n => filter === 'ALL' || n.type === filter);
      const unreadCount = notificationsList.filter(n => !n.read).length;
      
      if (unreadCount > 0) {
        badgeEl.textContent = unreadCount;
        badgeEl.style.display = 'flex';
      } else {
        badgeEl.style.display = 'none';
      }

      if (filtered.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; padding:2rem; color:var(--muted);">No notifications matching filter</div>';
        return;
      }

      listEl.innerHTML = filtered.map(item => `
        <div class="notification-item ${item.read ? '' : 'unread'}">
          <div class="notification-item-message">${item.message}</div>
          <div class="notification-item-time">${new Date(item.timestamp).toLocaleString()}</div>
          <div class="notification-actions">
            ${item.read ? '' : `<button class="notification-btn read-btn" onclick="markNotificationRead('${item.id}')">Read</button>`}
            <button class="notification-btn clear-btn" onclick="clearNotification('${item.id}')">Clear</button>
          </div>
        </div>
      `).join('');
    }

    async function markNotificationRead(id) {
      try {
        const response = await fetch(`${API_URL}/admin/notifications/${id}/read`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        if (response.ok) {
          loadNotifications();
        }
      } catch (err) {
        console.error('Failed to mark read', err);
      }
    }

    async function clearNotification(id) {
      try {
        const response = await fetch(`${API_URL}/admin/notifications/${id}/clear`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        if (response.ok) {
          loadNotifications();
        }
      } catch (err) {
        console.error('Failed to clear notification', err);
      }
    }

    async function clearAllNotifications() {
      if (!confirm('Are you sure you want to clear all notifications?')) return;
      try {
        const response = await fetch(`${API_URL}/admin/notifications/clear-all`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        if (response.ok) {
          loadNotifications();
        }
      } catch (err) {
        console.error('Failed to clear all notifications', err);
      }
    }

    function toggleNotificationDrawer(show) {
      const drawer = document.getElementById('notificationDrawer');
      if (show) {
        drawer.classList.add('active');
        loadNotifications();
      } else {
        drawer.classList.remove('active');
      }
    }

    function populateLockerDropdowns(lockers) {
      const selectEl = document.getElementById('newUserLocker');
      if (!selectEl) return;
      const available = lockers.filter(l => !l.assignedTo && !l.userId && !l.assignedUser);
      let html = '<option value="">Select an available locker</option>';
      if (available.length === 0) {
        html += '<option value="">No lockers available</option>';
      } else {
        available.forEach(l => {
          html += `<option value="${l.id}">${l.id}</option>`;
        });
      }
      selectEl.innerHTML = html;
    }

    function parseStudentId(message) {
      if (!message) return 'N/A';
      const match = message.match(/student\s*(?:\:|\s+)\s*([^\s()]+)/i);
      return match ? match[1] : 'N/A';
    }

    function openLockerHistoryModal(lockerId) {
      const portal = document.getElementById('assignModalPortal');
      if (!portal) return;

      const historyLogs = allLogsData.filter(log => 
        log.lockerId === lockerId && (log.eventType === 'ASSIGN' || log.eventType === 'UNASSIGN')
      );

      let rowsHtml = '';
      if (historyLogs.length === 0) {
        rowsHtml = `
          <tr>
            <td colspan="4" style="text-align:center; padding:2rem; color:var(--muted); font-style:italic;">
              No assignment or release logs found for this locker.
            </td>
          </tr>
        `;
      } else {
        historyLogs.forEach(log => {
          const actionText = log.eventType === 'ASSIGN' ? 'Assign' : 'Release';
          const actionStyle = log.eventType === 'ASSIGN' ? 'color:var(--green); font-weight:700;' : 'color:var(--orange); font-weight:700;';
          const studentId = parseStudentId(log.description || log.details);
          const adminUser = log.userId || 'admin';
          const time = new Date(log.timestamp).toLocaleString();

          rowsHtml += `
            <tr style="border-bottom:1px solid var(--border);">
              <td style="padding:0.75rem; ${actionStyle}">${actionText}</td>
              <td style="padding:0.75rem;"><strong>${studentId}</strong></td>
              <td style="padding:0.75rem;">${adminUser}</td>
              <td style="padding:0.75rem;">${time}</td>
            </tr>
          `;
        });
      }

      portal.innerHTML = `
        <div class="modal-overlay" id="history-modal" onclick="maybeCloseHistoryModal(event)">
          <div class="modal-card" style="max-width: 600px; width:100%;">
            <h3 style="margin-top:0;">Assignment History - Locker ${lockerId}</h3>
            <div class="table-container" style="max-height: 300px; overflow-y: auto; margin-top: 1rem; border:1px solid var(--border); border-radius:8px;">
              <table style="width:100%; border-collapse: collapse; text-align:left;">
                <thead>
                  <tr style="background:var(--canvas); border-bottom:1px solid var(--border); color:var(--text-muted); font-size:0.8rem; text-transform:uppercase;">
                    <th style="padding:0.75rem;">Action</th>
                    <th style="padding:0.75rem;">Student ID</th>
                    <th style="padding:0.75rem;">Admin</th>
                    <th style="padding:0.75rem;">Timestamp</th>
                  </tr>
                </thead>
                <tbody>
                  ${rowsHtml}
                </tbody>
              </table>
            </div>
            <div class="modal-actions" style="margin-top: 1.5rem; justify-content: flex-end;">
              <button class="btn-cancel" onclick="closeHistoryModal()">Close</button>
            </div>
          </div>
        </div>
      `;
    }

    function maybeCloseHistoryModal(e) {
      if (e.target.id === 'history-modal') closeHistoryModal();
    }

    function closeHistoryModal() {
      const portal = document.getElementById('assignModalPortal');
      if (portal) portal.innerHTML = '';
    }

    init();
  </script>
</body>
